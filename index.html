<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildWise AI — پاکستان میں سمارٹ تعمیراتی منصوبہ بندی اور تخمینہ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var lang = localStorage.getItem('buildwise_language');
          if (lang === 'ur' || (!lang && navigator.language && navigator.language.startsWith('ur'))) {
            document.documentElement.setAttribute('lang', 'ur');
            document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.classList.add('urdu-font');
          }
          var theme = localStorage.getItem('theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
